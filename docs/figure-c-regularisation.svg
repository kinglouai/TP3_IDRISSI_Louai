<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Rôle de C et du seuil de décision dans une régression logistique</title>
  <desc id="desc">C règle la régularisation pendant l'entraînement. Après prédiction de probabilités, le seuil de décision détermine une alerte.</desc>
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#17324d}.label{font:700 22px Arial,sans-serif;fill:#17324d}.text{font:18px Arial,sans-serif;fill:#334e68}.small{font:16px Arial,sans-serif;fill:#486581}.mono{font:700 18px monospace;fill:#17324d}.card{stroke:#b9d4df;stroke-width:2}.arrow{stroke:#275f7a;stroke-width:4;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#275f7a"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#fbfcfe"/>
  <text x="600" y="54" text-anchor="middle" class="title">Deux paramètres, deux moments différents</text>
  <line x1="70" y1="82" x2="1130" y2="82" stroke="#d6e3ea" stroke-width="2"/>
  <text x="70" y="120" class="label">1. Pendant l'entraînement : C règle la régularisation</text>
  <rect x="70" y="150" width="300" height="170" rx="16" fill="#e8f1f5" class="card"/>
  <text x="220" y="190" text-anchor="middle" class="mono">C = 0.1</text>
  <text x="220" y="222" text-anchor="middle" class="text">régularisation forte</text>
  <text x="220" y="252" text-anchor="middle" class="small">coefficients plus contraints</text>
  <text x="220" y="278" text-anchor="middle" class="small">modèle plus prudent</text>
  <rect x="450" y="150" width="300" height="170" rx="16" fill="#fff6df" class="card"/>
  <text x="600" y="190" text-anchor="middle" class="mono">C = 1.0</text>
  <text x="600" y="222" text-anchor="middle" class="text">compromis</text>
  <text x="600" y="252" text-anchor="middle" class="small">régularisation et ajustement</text>
  <text x="600" y="278" text-anchor="middle" class="small">à comparer dans le TP</text>
  <rect x="830" y="150" width="300" height="170" rx="16" fill="#fbe9ea" class="card"/>
  <text x="980" y="190" text-anchor="middle" class="mono">C = 10.0</text>
  <text x="980" y="222" text-anchor="middle" class="text">régularisation faible</text>
  <text x="980" y="252" text-anchor="middle" class="small">coefficients plus libres</text>
  <text x="980" y="278" text-anchor="middle" class="small">ajustement plus flexible</text>
  <path d="M370 235 H440" class="arrow"/><path d="M750 235 H820" class="arrow"/>
  <text x="600" y="375" text-anchor="middle" class="label">2. Après l'entraînement : le seuil transforme une probabilité en alerte</text>
  <rect x="105" y="415" width="250" height="100" rx="14" fill="#eef5f7" class="card"/>
  <text x="230" y="455" text-anchor="middle" class="text">Observations machine</text>
  <text x="230" y="485" text-anchor="middle" class="small">capteurs + modèle entraîné</text>
  <path d="M355 465 H460" class="arrow"/>
  <rect x="470" y="415" width="260" height="100" rx="14" fill="#eef5f7" class="card"/>
  <text x="600" y="455" text-anchor="middle" class="mono">predict_proba → 0.18</text>
  <text x="600" y="485" text-anchor="middle" class="small">probabilité de panne estimée</text>
  <path d="M730 465 H835" class="arrow"/>
  <rect x="845" y="415" width="250" height="100" rx="14" fill="#fff6df" class="card"/>
  <text x="970" y="455" text-anchor="middle" class="mono">seuil = 0.10</text>
  <text x="970" y="485" text-anchor="middle" class="small">0.18 ≥ 0.10 → alerte</text>
  <text x="600" y="590" text-anchor="middle" class="text">C change le modèle appris ; le seuil change la décision prise à partir de ses probabilités.</text>
  <text x="600" y="625" text-anchor="middle" class="small">Comparer C exige de garder le split et les autres paramètres constants. Comparer les seuils ne réentraîne pas le modèle.</text>
</svg>
